notes: |
  The 2001 PDF text layer is severely CID-corrupted (font subset issue) and
  the OCR'd output fuses adjacent labels into multi-line garble (e.g.
  "Lucros Acumulados Reservas de Lucros Reservas de Capital ..."). The
  values themselves can be partially recovered but verification against a
  verbatim quote isn't feasible from the 2001 PDF alone.

  As an alternative, the 2002 brochure publishes a clean 2001 prior-period
  column for both BP and DRE — that is what this YAML hand-keys, with the
  source_quote citing the 2002 PDF (data/raw/pdfs/cc3f0c13...). The user
  reading these figures can verify them against the 2002 brochure's
  prior-period column, which is more legible than the 2001 source.

  This is the same authority pattern accountants use when a prior period
  is restated by a later annual.

