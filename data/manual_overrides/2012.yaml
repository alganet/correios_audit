notes: |
  Parser regression: the 2012 PDF's DRE was extracted with row-ordering
  bugs (column values flipped vs header). The BP totals row was also
  missed by the parser despite the OCR capturing it cleanly at p1 y=366.
  Headlines below provide a verifiable baseline so the verify gates have
  ground truth. Followup: investigate parser routing on this doc.

  DRE column-flip note: page 2 prints "2012 2011" header but OCR placed
  values in reversed column order on the CPV row specifically. Math check:
  receita_liquida (2012) - lucro_bruto (2012) = -CPV (2012)
    13,970,372 - 3,765,001 = 10,205,371 → CPV 2012 = -10,205,371
  Confirmed against 2014 vintage prior-period column for 2012.

materiality_satisfied_by_overrides: true
