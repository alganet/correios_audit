  positional-parse routing and never reached canonical (BP/DFC/DVA all
  parsed fine). Headlines below are hand-keyed from the OCR'd JSON to
  give materiality / dre_coverage gates a baseline. Followup: investigate
  why the parser missed DRE on this doc.

  Values are consolidado-side; the 2017 brochure showed 4 columns
  (Controladora 2017/2016, Consolidado 2017/2016).

